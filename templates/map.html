<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='map.css') }}">
    <link rel="stylesheet" href="{{url_for('static' , filename='leaflet/leaflet.css')}}">
    <script src="{{url_for('static' , filename='leaflet/leaflet.js')}}"></script>
</head>
<body> 
    <div id="map" style="width: 100%; height: 600px;">
        <div id="sidebar" class="filter">
            <h2>Filter Images</h2>
            <form id="filter-form">
                <h3 class="showFilter-text" onclick="toggleFilter('class-filter')">Select Classes ↓</h3>
                <div class="filter-class" id="class-filter" hidden>
                    {% for class in classes %}
                    <label class="class-list">
                        <input type="checkbox" name="class" value="{{ class }}" checked>
                        <span class="class-label">{{ class }}</span>
                    </label>
                    {% endfor %}
                </div>
                <br><br>
                <button type="button" onclick="applyFilters()">Apply Filters</button>
            </form>
        </div>
    </div>
    
    <script>
        let images = {{ images|tojson }};
        const URL_for_images = "{{ url_for('static', filename='img/Images/') }}";
        const URL_for_view_image = "{{ url_for('main_routes.view_image', image_id=0) }}";
        // Ask for user's location 
        navigator.geolocation.getCurrentPosition(function(position) {
            var userLat = position.coords.latitude;
            var userLon = position.coords.longitude;

            if (!userLat || !userLon) {
                userLat = 51.505; // Default latitude
                userLon = -0.09; // Default longitude
            }
            var map = L.map('map', { dragging: true }).setView([userLat, userLon], 13);

            // Set up the OpenStreetMap layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Add a marker at the user's location
            L.marker([userLat, userLon]).addTo(map)
                .bindPopup('You are here!')
                .openPopup();
            addPointsToMap(map , images);
        });

        function addPointsToMap(map , filteredImages){
            // Logic of filtering images allowing to show only those required.
            filteredImages.forEach(function(image) {
                if (image.latitude && image.longitude) {
                    const icon = L.icon({
                        iconUrl: URL_for_images + image.file_path,
                        iconSize: [80, 80],
                        iconAnchor: [22, 94],
                        popupAnchor: [-3, -76]
                    });
                    L.marker([image.latitude, image.longitude], { icon: icon })
                        .addTo(map)
                        .bindPopup(`
                            <div class="popup-content">
                                <img src="${URL_for_images + image.file_path}" width="100">
                                <br>
                                <h3>${image.title || 'Untitled'}</h3>
                                <p><strong>Description:</strong> ${image.description || 'No description available'}</p>
                                <p><strong>Capture Date:</strong> ${image.capture_date || 'Unknown'}</p>
                                <p><strong>Location:</strong> ${image.location_name || 'Unknown'}</p>
                                <p><strong>Coordinates:</strong> (${image.latitude.toFixed(5)}, ${image.longitude.toFixed(5)})</p>
                                <p><strong>Source:</strong> ${image.source_type || 'Unknown'}</p>
                                <button onclick="window.open(URL_for_view_image.replace('0', ${image.image_id}))">View Details</button>
                            </div>
                        `);
                }
            }); 
        }
        function toggleFilter(filterId) {
            const filterDiv = document.getElementById(filterId);
            if (filterDiv){
                filterDiv.classList.toggle('visible');
            }
        }
    </script>
</body>
