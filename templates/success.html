<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
</html>
<script>
    const image = {{ image|tojson }};
    let token = "{{ token }}";
    if (token && token.length > 0) {
        localStorage.setItem('upload_done', JSON.stringify({ 'status': 'success', 'csrf_token': token , 'image': image }));
    }
    window.close();
</script>
