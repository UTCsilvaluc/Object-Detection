<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='gallery.css') }}">
</head>
<body>
    <div class="gallery-container">
        {% for image in images %}
        <a class="gallery-item" href="{{ url_for('main_routes.view_image', image_id=image.image_id) }}">
            <img
                src="{{ url_for('static', filename='img/Images/' + image.file_path) }}"
                alt="{{ image.title }}"
                loading="lazy"
                decoding="async"
                fetchpriority="low"
                width="220"
                height="180"
            >
            <div class="info">
                <h3>Title : {{ image.title }}</h3>
                <p>Description : {{ image.description }}</p>
                <p>Capture Date : {{ image.capture_date }}</p>
                <p>Location Name : {{ image.location_name }}</p>
            </div>
        </a>
        {% endfor %}
    </div>
</body>
</html>
