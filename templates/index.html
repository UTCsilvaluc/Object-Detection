<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Object Detection (物体検出)</h1>
        <div class="top-actions">
            <a class="queue-link" href="{{ url_for('analysis.queue_page') }}">Pre-analyze multiple images</a>
        </div>
        <form action="{{ url_for('analysis.upload') }}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="">

            <div class="mode-toggle">
                <label>Analysis mode</label>
                <div class="mode-options">
                    <label><input type="radio" name="analysis_mode" id="mode-new" value="new" checked> New image</label>
                    <label><input type="radio" name="analysis_mode" id="mode-pre" value="pre"> Pre-analyzed image</label>
                </div>
            </div>

            <div id="preanalysis-select" class="preanalysis-select" hidden>
                <label for="preanalysis_id">Pre-analyzed image</label>
                <select id="preanalysis_id" name="preanalysis_id">
                    <option value="">— Select an image —</option>
                    {% for item in preanalysis %}
                        <option value="{{ item.id }}" data-preview="{{ item.preview_path }}">{{ item.label }}{% if item.num_objects is not none %} ({{ item.num_objects }} objects){% endif %}</option>
                    {% endfor %}
                </select>
                <p class="note">Pre-analyzed images come from the queue.</p>
                <div class="preanalysis-preview" id="preanalysis-preview" hidden>
                    <img id="preanalysis-preview-img" alt="Pre-analyzed preview">
                    <p id="preanalysis-preview-empty">No preview available.</p>
                </div>
            </div>
            
            <label for="image">Select Image (画像を選択)</label>
            <input type="file" id="image" name="image" accept="image/*" required>

            <label for="img_name">Image Name (画像名)</label>
            <input type="text" id="img_name" name="img_name" placeholder="Enter image name / 画像名を入力" onchange="checkTitleAvailability(this)" required>

            <label for="img_desc">Description (説明)</label> 
            <input type="text" id="img_desc" name="img_desc" placeholder="Enter description / 説明を入力">

            <div class="date-row">
                <label for="img_event_date">Event Date (イベント日付)</label>
                <div style="display: inline-flex; gap: 10px;">
                    <label for="event_date_time_toggle" style="font-size: 8px; text-align: center; margin-bottom: 0;"> Use Time (時間を使用) </label>
                    <input type="checkbox" id="event_date_time_toggle" name="event_date_time_toggle" title="Enable time" onclick="toggleDateTime('img_event_date', this)">
                </div>
            </div>
            <input type="date" id="img_event_date" name="img_event_date">

            <div class="date-row">
                <label for="img_picture_date">Picture Date (写真日付)</label>
                <div style="display: inline-flex; gap: 10px;">
                    <label for="picture_date_time_toggle" style="font-size: 8px; text-align: center; margin-bottom: 0;"> Use Time (時間を使用) </label>
                    <input type="checkbox" id="picture_date_time_toggle" name="picture_date_time_toggle" title="Enable time" onclick="toggleDateTime('img_picture_date', this)">
                </div>
            </div>
            <input type="date" id="img_picture_date" name="img_picture_date">

            <label for="img_location">Location (場所)</label>
            <input type="text" id="img_location" name="img_location" placeholder="City / Place / 都市・場所">

            <p class="note">Please enter the latitude and longitude of the image.  
            (画像の緯度と経度を入力してください)</p>
            
            <label for="img_latitude">Latitude (緯度)</label>
            <input type="text" id="img_latitude" name="img_latitude" placeholder="Ex: 35.6895">

            <label for="img_longitude">Longitude (経度)</label>
            <input type="text" id="img_longitude" name="img_longitude" placeholder="Ex: 139.6917">

            <label for="img_source">Image Source (画像ソース)</label>
            <input type="text" id="img_source" name="img_source" placeholder="Ex: Camera / Dataset / カメラ・データセット">

            <button type="submit">Upload and Detect (アップロードして検出)</button>
        </form>
    </div>
    <script>
        const titles = {{ titles|tojson }};
        const actionNew = "{{ url_for('analysis.upload') }}";
        const actionPre = "{{ url_for('analysis.use_preanalyzed') }}";
        const form = document.querySelector("form");
        const fileInput = document.getElementById("image");
        const preSelect = document.getElementById("preanalysis_id");
        const preWrapper = document.getElementById("preanalysis-select");
        const modeRadios = document.querySelectorAll("input[name='analysis_mode']");
        const preRadio = document.getElementById("mode-pre");
        const preAvailable = preSelect && preSelect.options.length > 1;
        const tempBase = "{{ url_for('main_routes.temp_img', filename='') }}";
        const previewWrap = document.getElementById("preanalysis-preview");
        const previewImg = document.getElementById("preanalysis-preview-img");
        const previewEmpty = document.getElementById("preanalysis-preview-empty");
        function checkTitleAvailability(){
            const titleInput = document.getElementById("img_name");
            const title = titleInput.value.trim();
            if (titles.includes(title)){
                alert("The image name already exists. Please choose a different name. 画像名は既に存在します。別の名前を選んでください。");
                titleInput.focus();
                return false;
            }
            return true;
        }
        function checkIfCoordinateMatch(){
            const reg = RegExp("^-?\\d{1,3}(?:[.,]\\d+)?$");
            const lat = document.getElementById("img_latitude").value;
            const lon = document.getElementById("img_longitude").value;
            if (lat && lon){
                if (!reg.test(lat) || !reg.test(lon)){
                    alert("Please enter valid coordinates (latitude and longitude). 有効な座標（緯度と経度）を入力してください。(e.g., 35.6895, 139.6917)");
                    return false;
                }
            }
            return true;
        }
        function validateForm(event) {
            const mode = document.querySelector("input[name='analysis_mode']:checked")?.value || "new";
            if (mode === "pre") {
                if (!preSelect || !preSelect.value) {
                    alert("Please select a pre-analyzed image.");
                    event.preventDefault();
                    return false;
                }
            }
            if (!checkTitleAvailability() || !checkIfCoordinateMatch()) {
                event.preventDefault();
                return false;
            }
            return true;
        }
        document.getElementById("image").addEventListener("change", e => {
            if (fileInput.disabled) return;
            const file = e.target.files[0];
            document.querySelectorAll("body > img").forEach(img => img.remove());
            if (file) document.body.insertAdjacentHTML("beforeend", `<img src="${URL.createObjectURL(file)}" style="max-width:200px;">`);
        });

        document.querySelector("form").addEventListener("submit", validateForm);

        function getDataFromURL(){
            const urlParams = new URLSearchParams(window.location.search);
            const lat = urlParams.get('latitude');
            const lon = urlParams.get('longitude');
            const token = urlParams.get('token');
            if (lat && lon){
                document.getElementById("img_latitude").value = lat;
                document.getElementById("img_longitude").value = lon;
            }
            if (token){
                document.querySelector("input[name='csrf_token']").value = token;
                return {lat, lon};
            }
        }

        window.onload = () => {
            getDataFromURL();
        };

        function updateMode() {
            let mode = document.querySelector("input[name='analysis_mode']:checked")?.value || "new";
            if (!preAvailable && mode === "pre") {
                const fallback = document.getElementById("mode-new");
                if (fallback) fallback.checked = true;
                mode = "new";
            }
            if (mode === "pre") {
                form.action = actionPre;
                if (preWrapper) preWrapper.hidden = false;
                if (preSelect) {
                    preSelect.disabled = false;
                    preSelect.required = true;
                }
                fileInput.required = false;
                fileInput.disabled = true;
                fileInput.value = "";
                document.querySelectorAll("body > img").forEach(img => img.remove());
                updatePreview();
            } else {
                form.action = actionNew;
                if (preWrapper) preWrapper.hidden = true;
                if (preSelect) {
                    preSelect.disabled = true;
                    preSelect.required = false;
                }
                fileInput.required = true;
                fileInput.disabled = false;
                if (previewWrap) previewWrap.hidden = true;
            }
        }

        function updatePreview() {
            if (!previewWrap || !previewImg || !previewEmpty) return;
            const opt = preSelect?.selectedOptions?.[0];
            const previewPath = opt?.dataset?.preview || "";
            if (!previewPath) {
                previewImg.removeAttribute("src");
                previewImg.style.display = "none";
                previewEmpty.style.display = "block";
                previewWrap.hidden = false;
                return;
            }
            previewImg.src = tempBase + encodeURIComponent(previewPath);
            previewImg.style.display = "block";
            previewEmpty.style.display = "none";
            previewWrap.hidden = false;
        }

        if (preSelect) {
            preSelect.addEventListener("change", updatePreview);
        }
        modeRadios.forEach(radio => radio.addEventListener("change", updateMode));
        if (!preAvailable && preRadio) {
            preRadio.disabled = true;
            const label = preRadio.closest("label");
            if (label) label.classList.add("disabled");
        }
        updateMode();
        function toggleDateTime(inputId, checkbox) {
            const input = document.getElementById(inputId);

            if (checkbox.checked) {
                // Swap to datetime-local
                const oldVal = input.value;
                input.type = "datetime-local";

                // If value exists but without time, append 00:00
                if (oldVal && oldVal.length === 10) {
                    input.value = oldVal + "T00:00";
                }
            } else {
                // Swap back to date only
                const oldVal = input.value;
                input.type = "date";

                // If value exists remove the time part
                if (oldVal && oldVal.includes("T")) {
                    input.value = oldVal.split("T")[0];
                }
            }
        }

    </script>
</body>
</html>
