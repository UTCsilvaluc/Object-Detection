services:
  db:
    image: postgres:16
    container_name: objectdetection-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: objectdetection-web
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/data
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:1.24-alpine
    container_name: objectdetection-nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/data:ro
    restart: unless-stopped

volumes:
  db_data:
  media_data:
